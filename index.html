<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quran Reader</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #17251d;
    transition: 0.3s;
}

body.dark {
    background: #101713;
    color: #f1f5f2;
}

header {
    background: #075e3b;
    color: white;
    padding: 18px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 12px rgba(0,0,0,.2);
}

header h1 {
    font-size: 28px;
}

header p {
    margin-top: 5px;
    opacity: .85;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.controls {
    background: white;
    padding: 18px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.dark .controls {
    background: #18231d;
}

.row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

select,
input,
button {
    border: 1px solid #ccd8d1;
    border-radius: 9px;
    padding: 12px;
    font-size: 15px;
}

select,
input {
    flex: 1;
    min-width: 180px;
    background: white;
}

.dark select,
.dark input {
    background: #243129;
    color: white;
    border-color: #3b4b42;
}

button {
    cursor: pointer;
    background: #075e3b;
    color: white;
    border: none;
    transition: .2s;
}

button:hover {
    background: #087a4b;
    transform: translateY(-1px);
}

button.secondary {
    background: #e7eee9;
    color: #075e3b;
}

.dark button.secondary {
    background: #2a3830;
    color: #bce8cf;
}

.surah-info {
    text-align: center;
    margin: 25px 0;
}

.surah-info h2 {
    color: #075e3b;
    font-size: 28px;
}

.dark .surah-info h2 {
    color: #6ed69c;
}

.bismillah {
    font-family: "Times New Roman", serif;
    font-size: 32px;
    text-align: center;
    margin: 20px 0;
}

.ayah {
    background: white;
    border-radius: 15px;
    padding: 22px;
    margin: 15px 0;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
    position: relative;
    transition: .2s;
}

.dark .ayah {
    background: #18231d;
}

.ayah.playing {
    border-left: 5px solid #0a8f58;
    background: #eaf8f0;
}

.dark .ayah.playing {
    background: #1c3327;
}

.ayah-number {
    display: inline-flex;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #075e3b;
    color: white;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-bottom: 15px;
}

.arabic {
    font-family: "Traditional Arabic", "Amiri", "Times New Roman", serif;
    font-size: 32px;
    line-height: 2.1;
    text-align: right;
    direction: rtl;
    margin-bottom: 15px;
}

.translation {
    font-size: 17px;
    line-height: 1.7;
    color: #4c5b52;
}

.dark .translation {
    color: #c5d0c9;
}

.ayah-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
}

.ayah-actions button {
    padding: 8px 12px;
    font-size: 13px;
}

.bookmarked {
    color: #ffd700 !important;
}

.repeat-active {
    background: #b8860b !important;
    color: white !important;
}

.surah-repeat-active {
    background: #8b4513 !important;
    color: white !important;
}

.audio-player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #075e3b;
    color: white;
    padding: 12px 20px;
    z-index: 200;
    box-shadow: 0 -3px 15px rgba(0,0,0,.2);
}

.audio-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.audio-info {
    flex: 1;
    min-width: 120px;
}

.audio-info strong {
    display: block;
}

.audio-info small {
    opacity: .8;
}

audio {
    width: 45%;
}

.loading {
    text-align: center;
    padding: 50px;
    font-size: 18px;
}

.no-results {
    text-align: center;
    padding: 40px;
}

footer {
    text-align: center;
    padding: 80px 20px 120px;
    color: #68766d;
}

@media(max-width: 700px) {

    header h1 {
        font-size: 23px;
    }

    .arabic {
        font-size: 27px;
    }

    .translation {
        font-size: 15px;
    }

    .audio-inner {
        flex-wrap: wrap;
    }

    audio {
        width: 100%;
    }

}

</style>
</head>

<body>

<header>

    <h1>☪ Quran Reader</h1>

    <p>
        Read • Listen • Reflect
    </p>

</header>


<div class="container">


    <div class="controls">


        <div class="row">


            <select id="surahSelect">

                <option value="">
                    Loading Surahs...
                </option>

            </select>


            <select id="reciterSelect">

                <option value="ar.alafasy">
                    Mishary Rashid Alafasy
                </option>

                <option value="ar.abdulbasitmurattal">
                    Abdul Basit Abdul Samad
                </option>

                <option value="ar.abdullahbasfar">
                    Abdullah Basfar
                </option>

                <option value="ar.husary">
                    Mahmoud Khalil Al-Husary
                </option>

                <option value="ar.minshawi">
                    Mohamed Siddiq Al-Minshawi
                </option>

                <option value="ar.abdurrahmaansudais">
                    Abdurrahman as-Sudais
                </option>

            </select>


        </div>


        <div class="row">


            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search Arabic, translation, or ayah..."
            >


            <button onclick="searchAyahs()">
                Search
            </button>


            <button
                class="secondary"
                onclick="showBookmarks()"
            >
                🔖 Bookmarks
            </button>


            <button
                class="secondary"
                onclick="toggleDarkMode()"
            >
                🌙 Dark Mode
            </button>


            <button
                class="secondary"
                onclick="resetReader()"
            >
                ↻ Reset
            </button>


        </div>


        <div class="row">


            <button
                id="surahRepeatButton"
                onclick="toggleSurahRepeat()"
            >
                🔁 Repeat Surah
            </button>


        </div>


    </div>


    <div id="content">

        <div class="loading">
            Loading Quran...
        </div>

    </div>


</div>


<footer>

    <p>
        Quran Reader • Made for reading and listening
    </p>

    <p style="margin-top:8px;">
        Quran data provided through AlQuran Cloud API
    </p>

</footer>


<div class="audio-player">

    <div class="audio-inner">


        <div class="audio-info">

            <strong id="nowPlaying">
                Nothing playing
            </strong>

            <small id="reciterName">
                Select an ayah to listen
            </small>

        </div>


        <button onclick="previousAyah()">
            ⏮
        </button>


        <button
            onclick="toggleAudio()"
            id="playButton"
        >
            ▶
        </button>


        <button onclick="nextAyah()">
            ⏭
        </button>


        <audio
            id="audio"
            controls
        ></audio>


    </div>

</div>


<script>


const API =
    "https://api.alquran.cloud/v1";


let currentSurah = 1;

let currentAyah = 0;

let ayahs = [];


let bookmarks =
    JSON.parse(
        localStorage.getItem(
            "quranBookmarks"
        ) || "[]"
    );


/*
====================================
REPEAT SETTINGS
====================================
*/


let repeatAyah = false;

let repeatIndex = null;

let repeatSurah = false;


/*
====================================
RECITERS
====================================
*/


const reciters = {

    "ar.alafasy":
        "Mishary Rashid Alafasy",

    "ar.abdulbasitmurattal":
        "Abdul Basit Abdul Samad",

    "ar.abdullahbasfar":
        "Abdullah Basfar",

    "ar.husary":
        "Mahmoud Khalil Al-Husary",

    "ar.minshawi":
        "Mohamed Siddiq Al-Minshawi",

    "ar.abdurrahmaansudais":
        "Abdurrahman as-Sudais"

};


/*
====================================
LOAD SURAH LIST
====================================
*/


async function loadSurahList() {

    try {

        const response =
            await fetch(
                API + "/surah"
            );

        const data =
            await response.json();


        const select =
            document.getElementById(
                "surahSelect"
            );


        select.innerHTML = "";


        data.data.forEach(
            surah => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    surah.number;


                option.textContent =
                    surah.number +
                    ". " +
                    surah.englishName +
                    " — " +
                    surah.name;


                select.appendChild(
                    option
                );

            }
        );


        select.value =
            currentSurah;


        select.addEventListener(
            "change",
            function() {

                currentSurah =
                    parseInt(
                        this.value
                    );


                stopAllRepeat();


                loadSurah(
                    currentSurah
                );

            }
        );


        loadSurah(
            currentSurah
        );

    }

    catch(error) {

        document.getElementById(
            "content"
        ).innerHTML =

            "<div class='no-results'>" +
            "Unable to load Quran data. " +
            "Please check your internet connection." +
            "</div>";

    }

}


/*
====================================
LOAD SURAH
====================================
*/


async function loadSurah(
    number
) {

    stopAllRepeat();


    document.getElementById(
        "content"
    ).innerHTML =

        "<div class='loading'>" +
        "📖 Loading Surah..." +
        "</div>";


    try {

        const response =
            await fetch(

                API +
                "/surah/" +
                number +
                "/editions/quran-uthmani,en.sahih"

            );


        const data =
            await response.json();


        const arabic =
            data.data[0];


        const translation =
            data.data[1];


        ayahs =
            arabic.ayahs.map(
                (ayah, index) => ({

                    number:
                        ayah.numberInSurah,

                    globalNumber:
                        ayah.number,

                    arabic:
                        ayah.text,

                    translation:
                        translation
                            .ayahs[index]
                            .text

                })
            );


        currentAyah =
            0;


        renderSurah(
            arabic,
            ayahs
        );

    }

    catch(error) {

        document.getElementById(
            "content"
        ).innerHTML =

            "<div class='no-results'>" +
            "Could not load this Surah." +
            "</div>";

    }

}


/*
====================================
RENDER SURAH
====================================
*/


function renderSurah(
    surah,
    list
) {

    let html = "";


    html += `

        <div class="surah-info">

            <h2>
                ${surah.englishName}
            </h2>

            <p>
                ${surah.englishNameTranslation}
            </p>

            <p>
                ${surah.numberOfAyahs}
                Ayahs
            </p>

        </div>

    `;


    if (
        surah.number !== 9
    ) {

        html += `

            <div class="bismillah">

                بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ

            </div>

        `;

    }


    list.forEach(
        (ayah, index) => {

            html +=
                createAyahHTML(
                    ayah,
                    index
                );

        }
    );


    document.getElementById(
        "content"
    ).innerHTML =
        html;


    updateBookmarkButtons();

    updateRepeatButtons();

}


/*
====================================
CREATE AYAH
====================================
*/


function createAyahHTML(
    ayah,
    index
) {

    const saved =
        bookmarks.includes(
            `${currentSurah}:${ayah.number}`
        );


    return `

        <div
            class="ayah"
            id="ayah-${index}"
        >


            <div class="ayah-number">

                ${ayah.number}

            </div>


            <div class="arabic">

                ${ayah.arabic}

            </div>


            <div class="translation">

                ${ayah.translation}

            </div>


            <div class="ayah-actions">


                <button
                    onclick="playAyah(${index})"
                >

                    🔊 Listen

                </button>


                <button
                    class="secondary ${saved ? "bookmarked" : ""}"
                    id="bookmark-${index}"
                    onclick="toggleBookmark(${index})"
                >

                    ${
                        saved
                        ? "★ Bookmarked"
                        : "☆ Bookmark"
                    }

                </button>


                <button
                    class="secondary"
                    id="repeat-${index}"
                    onclick="toggleRepeat(${index})"
                >

                    🔁 Repeat

                </button>


                <button
                    class="secondary"
                    onclick="copyAyah(${index})"
                >

                    📋 Copy

                </button>


            </div>


        </div>

    `;

}


/*
====================================
PLAY AYAH
====================================
*/


function playAyah(
    index
) {

    if (
        !ayahs[index]
    )
        return;


    currentAyah =
        index;


    const ayah =
        ayahs[index];


    const reciter =
        document.getElementById(
            "reciterSelect"
        ).value;


    const audioURL =
        `https://cdn.islamic.network/quran/audio/128/${reciter}/${ayah.globalNumber}.mp3`;


    const audio =
        document.getElementById(
            "audio"
        );


    audio.src =
        audioURL;


    document.getElementById(
        "nowPlaying"
    ).textContent =
        `Ayah ${ayah.number}`;


    document.getElementById(
        "reciterName"
    ).textContent =
        reciters[reciter];


    document
        .querySelectorAll(".ayah")
        .forEach(
            el =>
                el.classList.remove(
                    "playing"
                )
        );


    const element =
        document.getElementById(
            `ayah-${index}`
        );


    if (element) {

        element.classList.add(
            "playing"
        );


        element.scrollIntoView({

            behavior:
                "smooth",

            block:
                "center"

        });

    }


    audio.play()
        .catch(
            () => {}
        );


    document.getElementById(
        "playButton"
    ).textContent =
        "⏸";

}


/*
====================================
REPEAT INDIVIDUAL AYAH
====================================
*/


function toggleRepeat(
    index
) {


    /*
    Stop whole-Surah repeat.
    */

    if (
        repeatSurah
    ) {

        repeatSurah =
            false;

        updateSurahRepeatButton();

    }


    /*
    If this ayah is already
    repeating, stop it.
    */

    if (
        repeatAyah &&
        repeatIndex === index
    ) {

        stopRepeat();

        return;

    }


    repeatAyah =
        true;


    repeatIndex =
        index;


    currentAyah =
        index;


    playAyah(
        index
    );


    repeatAyah =
        true;


    repeatIndex =
        index;


    updateRepeatButtons();

}


/*
====================================
STOP INDIVIDUAL REPEAT
====================================
*/


function stopRepeat() {

    repeatAyah =
        false;


    repeatIndex =
        null;


    updateRepeatButtons();

}


/*
====================================
REPEAT WHOLE SURAH
====================================
*/


function toggleSurahRepeat() {


    /*
    If already repeating,
    stop it.
    */

    if (
        repeatSurah
    ) {

        stopSurahRepeat();

        return;

    }


    /*
    Stop individual repeat.
    */

    repeatAyah =
        false;


    repeatIndex =
        null;


    /*
    Start Surah repeat.
    */

    repeatSurah =
        true;


    updateRepeatButtons();


    updateSurahRepeatButton();


    /*
    Start from first ayah.
    */

    playAyah(
        0
    );


    repeatSurah =
        true;


    updateSurahRepeatButton();

}


/*
====================================
STOP SURAH REPEAT
====================================
*/


function stopSurahRepeat() {

    repeatSurah =
        false;


    updateSurahRepeatButton();

}


/*
====================================
STOP ALL REPEAT
====================================
*/


function stopAllRepeat() {

    repeatAyah =
        false;


    repeatIndex =
        null;


    repeatSurah =
        false;


    updateRepeatButtons();


    updateSurahRepeatButton();

}


/*
====================================
UPDATE SURAH REPEAT BUTTON
====================================
*/


function updateSurahRepeatButton() {

    const button =
        document.getElementById(
            "surahRepeatButton"
        );


    if (!button)
        return;


    if (
        repeatSurah
    ) {

        button.textContent =
            "⏹ Stop Repeat Surah";


        button.classList.add(
            "surah-repeat-active"
        );

    }

    else {

        button.textContent =
            "🔁 Repeat Surah";


        button.classList.remove(
            "surah-repeat-active"
        );

    }

}


/*
====================================
UPDATE AYAH REPEAT BUTTONS
====================================
*/


function updateRepeatButtons() {

    document
        .querySelectorAll(
            "[id^='repeat-']"
        )
        .forEach(
            button => {

                const index =
                    parseInt(
                        button.id.replace(
                            "repeat-",
                            ""
                        )
                    );


                if (
                    repeatAyah &&
                    repeatIndex === index
                ) {

                    button.textContent =
                        "⏹ Stop Repeat";


                    button.classList.add(
                        "repeat-active"
                    );

                }

                else {

                    button.textContent =
                        "🔁 Repeat";


                    button.classList.remove(
                        "repeat-active"
                    );

                }

            }
        );

}


/*
====================================
AUDIO CONTROLS
====================================
*/


function toggleAudio() {

    const audio =
        document.getElementById(
            "audio"
        );


    if (!audio.src) {

        playAyah(
            currentAyah
        );

        return;

    }


    if (
        audio.paused
    ) {

        audio.play();


        document.getElementById(
            "playButton"
        ).textContent =
            "⏸";

    }

    else {

        audio.pause();


        document.getElementById(
            "playButton"
        ).textContent =
            "▶";

    }

}


/*
====================================
NEXT AYAH
====================================
*/


function nextAyah() {

    stopAllRepeat();


    if (
        currentAyah <
        ayahs.length - 1
    ) {

        playAyah(
            currentAyah + 1
        );

    }

}


/*
====================================
PREVIOUS AYAH
====================================
*/


function previousAyah() {

    stopAllRepeat();


    if (
        currentAyah > 0
    ) {

        playAyah(
            currentAyah - 1
        );

    }

}


/*
====================================
AUDIO ENDED
====================================
*/


document
    .getElementById(
        "audio"
    )
    .addEventListener(
        "ended",
        function() {


            /*
            INDIVIDUAL AYAH REPEAT
            */

            if (
                repeatAyah &&
                repeatIndex !== null
            ) {

                playAyah(
                    repeatIndex
                );


                repeatAyah =
                    true;


                repeatIndex =
                    currentAyah;


                updateRepeatButtons();


                return;

            }


            /*
            WHOLE SURAH REPEAT
            */

            if (
                repeatSurah
            ) {


                /*
                Last ayah reached.
                Start from Ayah 1.
                */

                if (
                    currentAyah >=
                    ayahs.length - 1
                ) {

                    playAyah(
                        0
                    );


                    repeatSurah =
                        true;


                    updateSurahRepeatButton();


                    return;

                }


                /*
                Continue to next ayah.
                */

                playAyah(
                    currentAyah + 1
                );


                repeatSurah =
                    true;


                updateSurahRepeatButton();


                return;

            }


            /*
            NORMAL PLAYBACK
            */

            if (
                currentAyah <
                ayahs.length - 1
            ) {

                playAyah(
                    currentAyah + 1
                );

            }

            else {

                document.getElementById(
                    "playButton"
                ).textContent =
                    "▶";

            }

        }
    );


/*
====================================
BOOKMARKS
====================================
*/


function toggleBookmark(
    index
) {

    const ayah =
        ayahs[index];


    const id =
        `${currentSurah}:${ayah.number}`;


    if (
        bookmarks.includes(id)
    ) {

        bookmarks =
            bookmarks.filter(
                item =>
                    item !== id
            );

    }

    else {

        bookmarks.push(
            id
        );

    }


    localStorage.setItem(
        "quranBookmarks",
        JSON.stringify(
            bookmarks
        )
    );


    updateBookmarkButtons();

}


/*
====================================
UPDATE BOOKMARK BUTTONS
====================================
*/


function updateBookmarkButtons() {

    ayahs.forEach(
        (ayah, index) => {

            const button =
                document.getElementById(
                    `bookmark-${index}`
                );


            if (!button)
                return;


            const id =
                `${currentSurah}:${ayah.number}`;


            if (
                bookmarks.includes(id)
            ) {

                button.classList.add(
                    "bookmarked"
                );


                button.textContent =
                    "★ Bookmarked";

            }

            else {

                button.classList.remove(
                    "bookmarked"
                );


                button.textContent =
                    "☆ Bookmark";

            }

        }
    );


    updateRepeatButtons();

}


/*
====================================
SHOW BOOKMARKS
====================================
*/


async function showBookmarks() {

    stopAllRepeat();


    if (
        bookmarks.length === 0
    ) {

        alert(
            "You have no bookmarks yet."
        );

        return;

    }


    document.getElementById(
        "content"
    ).innerHTML =

        "<div class='loading'>" +
        "Loading bookmarks..." +
        "</div>";


    let html = `

        <div class="surah-info">

            <h2>
                🔖 Your Bookmarks
            </h2>

            <p>
                ${bookmarks.length}
                saved ayah(s)
            </p>

        </div>

    `;


    for (
        const bookmark of bookmarks
    ) {


        const parts =
            bookmark.split(":");


        const surahNumber =
            parseInt(
                parts[0]
            );


        const ayahNumber =
            parseInt(
                parts[1]
            );


        try {

            const response =
                await fetch(

                    API +
                    "/surah/" +
                    surahNumber +
                    "/editions/quran-uthmani,en.sahih"

                );


            const data =
                await response.json();


            const arabic =
                data.data[0];


            const translation =
                data.data[1];


            const index =
                ayahNumber - 1;


            const ayah =
                arabic.ayahs[index];


            const trans =
                translation.ayahs[index];


            html += `

                <div class="ayah">


                    <div class="ayah-number">

                        ${surahNumber}:${ayahNumber}

                    </div>


                    <div class="arabic">

                        ${ayah.text}

                    </div>


                    <div class="translation">

                        ${trans.text}

                    </div>


                    <div class="ayah-actions">


                        <button onclick="
                            currentSurah=${surahNumber};
                            document.getElementById('surahSelect').value=${surahNumber};
                            loadSurah(${surahNumber});
                        ">

                            📖 Open Surah

                        </button>


                        <button
                            class="secondary"
                            onclick="removeBookmark('${bookmark}')"
                        >

                            🗑 Remove

                        </button>


                    </div>


                </div>

            `;

        }

        catch(e) {}

    }


    document.getElementById(
        "content"
    ).innerHTML =
        html;

}


/*
====================================
REMOVE BOOKMARK
====================================
*/


function removeBookmark(
    id
) {

    bookmarks =
        bookmarks.filter(
            item =>
                item !== id
        );


    localStorage.setItem(
        "quranBookmarks",
        JSON.stringify(
            bookmarks
        )
    );


    showBookmarks();

}


/*
====================================
COPY AYAH
====================================
*/


function copyAyah(
    index
) {

    const ayah =
        ayahs[index];


    const text =
        `${ayah.arabic}\n\n${ayah.translation}\n\n— ${currentSurah}:${ayah.number}`;


    navigator.clipboard
        .writeText(text)
        .then(
            () => {

                alert(
                    "Ayah copied!"
                );

            }
        )
        .catch(
            () => {

                alert(
                    "Unable to copy."
                );

            }
        );

}


/*
====================================
SEARCH
====================================
*/


async function searchAyahs() {

    const query =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if (!query) {

        loadSurah(
            currentSurah
        );

        return;

    }


    stopAllRepeat();


    document.getElementById(
        "content"
    ).innerHTML =

        "<div class='loading'>" +
        "🔎 Searching..." +
        "</div>";


    try {

        const response =
            await fetch(
                API +
                "/quran/en.sahih"
            );


        const data =
            await response.json();


        const results =
            data.data.ayahs.filter(
                ayah =>
                    ayah.text
                        .toLowerCase()
                        .includes(query)
            );


        if (
            results.length === 0
        ) {

            document.getElementById(
                "content"
            ).innerHTML =

                `<div class="no-results">

                    No results found for
                    "<strong>${query}</strong>"

                </div>`;

            return;

        }


        let html = `

            <div class="surah-info">

                <h2>
                    Search Results
                </h2>

                <p>
                    ${results.length}
                    result(s)
                </p>

            </div>

        `;


        results
            .slice(0, 100)
            .forEach(
                ayah => {

                    html += `

                        <div class="ayah">


                            <div class="ayah-number">

                                ${ayah.number}

                            </div>


                            <div class="translation">

                                ${ayah.text}

                            </div>


                            <div class="ayah-actions">


                                <button onclick="
                                    goToGlobalAyah(${ayah.number});
                                ">

                                    📖 Open

                                </button>


                            </div>


                        </div>

                    `;

                }
            );


        document.getElementById(
            "content"
        ).innerHTML =
            html;

    }

    catch(error) {

        document.getElementById(
            "content"
        ).innerHTML =

            "<div class='no-results'>" +
            "Search failed." +
            "</div>";

    }

}


/*
====================================
GO TO AYAH
====================================
*/


async function goToGlobalAyah(
    globalNumber
) {

    try {

        const response =
            await fetch(

                API +
                "/ayah/" +
                globalNumber +
                "/quran-uthmani,en.sahih"

            );


        const data =
            await response.json();


        const arabic =
            data.data[0];


        const surahNumber =
            arabic.surah.number;


        currentSurah =
            surahNumber;


        document.getElementById(
            "surahSelect"
        ).value =
            surahNumber;


        await loadSurah(
            surahNumber
        );


        const index =
            arabic.numberInSurah - 1;


        setTimeout(
            () => {

                const element =
                    document.getElementById(
                        `ayah-${index}`
                    );


                if (element) {

                    element.scrollIntoView({

                        behavior:
                            "smooth",

                        block:
                            "center"

                    });

                }

            },
            500
        );

    }

    catch(error) {

        alert(
            "Could not open ayah."
        );

    }

}


/*
====================================
DARK MODE
====================================
*/


function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "darkMode",
        document.body.classList.contains(
            "dark"
        )
    );

}


/*
====================================
RESET READER
====================================
*/


function resetReader() {

    stopAllRepeat();


    currentAyah =
        0;


    const audio =
        document.getElementById(
            "audio"
        );


    audio.pause();


    audio.removeAttribute(
        "src"
    );


    audio.load();


    document.getElementById(
        "nowPlaying"
    ).textContent =
        "Nothing playing";


    document.getElementById(
        "reciterName"
    ).textContent =
        "Select an ayah to listen";


    document.getElementById(
        "playButton"
    ).textContent =
        "▶";


    loadSurah(
        currentSurah
    );

}


/*
====================================
RECITER CHANGE
====================================
*/


document
    .getElementById(
        "reciterSelect"
    )
    .addEventListener(
        "change",
        function() {


            stopAllRepeat();


            const audio =
                document.getElementById(
                    "audio"
                );


            if (
                audio.src &&
                ayahs.length > 0
            ) {

                playAyah(
                    currentAyah
                );

            }

        }
    );


/*
====================================
ENTER TO SEARCH
====================================
*/


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchAyahs();

            }

        }
    );


/*
====================================
DARK MODE ON START
====================================
*/


if (
    localStorage.getItem(
        "darkMode"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}


/*
====================================
START
====================================
*/


loadSurahList();

</script>

</html>
